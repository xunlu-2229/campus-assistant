<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 装饰圆环 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
  <!-- 齿轮 -->
  <g transform="translate(256,256)">
    <!-- 8个齿 -->
    <g fill="url(#gear)">
      <rect x="-22" y="-130" width="44" height="50" rx="6"/>
      <rect x="-22" y="80" width="44" height="50" rx="6"/>
      <rect x="-130" y="-22" width="50" height="44" rx="6"/>
      <rect x="80" y="-22" width="50" height="44" rx="6"/>
      <g transform="rotate(45)">
        <rect x="-18" y="-128" width="36" height="46" rx="6"/>
        <rect x="-18" y="82" width="36" height="46" rx="6"/>
        <rect x="-128" y="-18" width="46" height="36" rx="6"/>
        <rect x="82" y="-18" width="46" height="36" rx="6"/>
      </g>
      <circle r="100" fill="url(#gear)"/>
    </g>
    <!-- 内圈 -->
    <circle r="60" fill="url(#bg)" opacity="0.9"/>
    <circle r="40" fill="#ffffff"/>
    <!-- 中心点 -->
    <circle r="14" fill="#7c3aed"/>
  </g>
  <!-- 底部文字 -->
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff">工科助手</text>
</svg>
